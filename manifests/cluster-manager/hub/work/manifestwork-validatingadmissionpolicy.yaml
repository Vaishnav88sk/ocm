apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: manifestwork-validation.open-cluster-management.io
  labels:
    {{ if gt (len .Labels) 0 }}
    {{ range $key, $value := .Labels }}
    "{{ $key }}": "{{ $value }}"
    {{ end }}
    {{ end }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:   ["work.open-cluster-management.io"]
      apiVersions: ["v1"]
      operations:  ["CREATE", "UPDATE"]
      resources:   ["manifestworks"]
  validations:
    - expression: >-
        !has(object.spec.executor) || !has(object.spec.executor.subject) ||
        object.spec.executor.subject.type != 'ServiceAccount' ||
        authorizer.requestResource.check("execute-as").allowed()
      message: "You do not have permission to execute-as the requested subject."
